# Publish site/ to GitHub Pages (gadget.means.live) on every push to main, and
# when the private repository's tools/publish.sh has made a Release (it starts
# this workflow on main: the github-pages environment deploys from main only,
# and a Release's own event runs on its tag): the page as it is (no build
# step), plus the newest Release's files (firmware, app, manifest.json) in
# site/firmware/, so images never enter git.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancels.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: The newest Release into site/firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/firmware
          if gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download --repo "$GITHUB_REPOSITORY" --dir site/firmware --clobber
            ls -l site/firmware
          else
            echo "No Release yet: the page says no firmware is published."
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
